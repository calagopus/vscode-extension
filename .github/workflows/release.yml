name: Release

on:
  push:
    branches:
      - main

env:
  PROJECT_NAME: calagopus

jobs:
  check:
    name: Check version
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      changed: ${{ steps.check.outputs.changed }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Check whether this version was already released
        id: check
        run: |
          VERSION="$(jq -r '.version' package.json)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if git rev-parse --verify --quiet "refs/tags/$VERSION" >/dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$VERSION already released; skipping publish."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::New version $VERSION detected; will publish."
          fi

  dist:
    name: Dist
    needs: [check]
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11
          run_install: false

      - name: Install dependencies
        run: pnpm install

      - name: Install vsce
        run: npm install -g @vscode/vsce

      - name: Package extension
        run: pnpm package

      - name: Upload vsix artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.PROJECT_NAME }}-vsix
          path: dist/${{ env.PROJECT_NAME }}.vsix

  publish:
    name: Publish
    needs: [check, dist]
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Generate release notes
        env:
          VERSION: ${{ needs.check.outputs.version }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          PREVIOUS_TAG="$(git describe --tags --abbrev=0 HEAD 2>/dev/null || true)"
          RANGE="${PREVIOUS_TAG:+$PREVIOUS_TAG..}HEAD"

          {
            echo "## What's Changed"
            echo
            git log --no-merges --format="- %s (%h)" "$RANGE"
            if [ -n "$PREVIOUS_TAG" ]; then
              echo
              echo "**Full Changelog**: $REPO_URL/compare/$PREVIOUS_TAG...$VERSION"
            fi
          } > release-notes.md

      - name: Download vsix artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.PROJECT_NAME }}-vsix
          path: dist

      - name: Publish to VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: npx --yes @vscode/vsce publish --packagePath dist/${{ env.PROJECT_NAME }}.vsix

      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: npx --yes ovsx publish dist/${{ env.PROJECT_NAME }}.vsix

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: ${{ needs.check.outputs.version }}
          tag_name: ${{ needs.check.outputs.version }}
          body_path: release-notes.md
          files: |
            dist/${{ env.PROJECT_NAME }}.vsix
